server:
  address: 127.0.0.1
  port: ${LEARNING_PORT:8099}
spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: embeddings-search
  ai:
    model:
      chat: none
    openai:
      api-key: ${OPENAI_API_KEY}
      embedding:
        max-retries: 0
        timeout: 15s
        options:
          model: ${OPENAI_EMBEDDING_MODEL}

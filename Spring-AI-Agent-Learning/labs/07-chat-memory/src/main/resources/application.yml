server:
  address: 127.0.0.1
  port: ${LEARNING_PORT:8097}

spring:
  application:
    name: chat-memory
  ai:
    model:
      embedding: none
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL}
          max-retries: 0
          timeout: 15s

# 브라우저의 다른 실습 서버 쿠키와 구분합니다.
server.servlet.session.cookie.name: LEARNING_MEMORY_SESSION
server.servlet.session.cookie.http-only: true
server.servlet.session.cookie.same-site: strict

server:
  address: 127.0.0.1
  port: ${LEARNING_PORT:8096}

spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: workflow-agent
  ai:
    model:
      embedding: none
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        max-retries: 0
        timeout: 5s
        options:
          model: ${OPENAI_MODEL}

learning:
  limits:
    max-model-calls: 8
    max-tool-calls: 4
    timeout-ms: 10000

server:
  address: 127.0.0.1
  port: ${LEARNING_PORT:8109}
  servlet:
    session:
      cookie:
        name: LEARNING_L07RUNTIME_SESSION
        http-only: true
        same-site: strict
spring:
  application:
    name: 07-07-runtime-memory
  config:
    import: "optional:file:.env[.properties]"
  ai:
    model:
      embedding: none
    openai:
      base-url: https://api.openai.com/v1
      api-key: ${OPENAI_API_KEY}
      timeout: 5s
      chat:
        max-retries: 0
        options:
          model: ${OPENAI_MODEL}
learning:
  memory:
    max-messages: 6
    redis:
      uri: ${CHAT_MEMORY_REDIS_URL:redis://127.0.0.1:16380}
      index-name: ${CHAT_MEMORY_REDIS_INDEX:learning07-runtime}
      key-prefix: ${CHAT_MEMORY_REDIS_PREFIX:learning07-runtime:}
      time-to-live: 24h
      initialize-schema: ${CHAT_MEMORY_REDIS_INITIALIZE_SCHEMA:true}

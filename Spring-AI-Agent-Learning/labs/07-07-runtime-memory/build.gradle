dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    testImplementation project(':Spring-AI-Agent-Learning:test-support')
    implementation 'org.springframework.ai:spring-ai-model-chat-memory-repository-redis'
    // Spring AI 2.1.0 Redis 저장소의 배포 POM과 같은 Jedis 버전을 사용합니다.
    implementation 'redis.clients:jedis:8.0.2'
}

tasks.named('bootRun') { workingDir rootProject.projectDir }
tasks.named('test') {
    workingDir rootProject.projectDir
    testLogging { showStandardStreams = true }
}

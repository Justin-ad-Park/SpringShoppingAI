server:
  address: 127.0.0.1
  port: 8092
spring:
  config:
    import: "optional:file:.env[.properties]"
  ai:
    model:
      embedding: none
    chat:
      client:
        enabled: false
    openai:
      base-url: https://api.openai.com/v1
      api-key: ${OPENAI_API_KEY}
      timeout: 5s
      chat:
        max-retries: 0
        options:
          model: ${OPENAI_MODEL}
    anthropic:
      base-url: https://api.anthropic.com
      api-key: ${ANTHROPIC_API_KEY}
      max-retries: 0
      timeout: 10s
      chat:
        model: ${ANTHROPIC_MODEL}
        max-tokens: 256

server:
  address: 127.0.0.1
  port: ${LEARNING_PORT:8095}

spring:
  application:
    name: tool-calling
  ai:
    model:
      embedding: none
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        max-retries: 0
        timeout: 15s
        options:
          model: ${OPENAI_CHAT_MODEL}

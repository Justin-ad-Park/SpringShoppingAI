server:
  address: 127.0.0.1
  port: ${LEARNING_PORT:8110}

spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: 06-tool-call-limits
  ai:
    model:
      embedding: none
    openai:
      api-key: ${OPENAI_API_KEY}
      timeout: 30s
      max-retries: 0
      chat:
        options:
          model: ${OPENAI_MODEL}
    tools:
      limits:
        # 사용자 질문 한 번을 처리하는 동안 같은 도구를 최대 2회 실행합니다. 세 번째 실행은 차단합니다.
        max-calls-per-tool-default: 2
        # 모든 도구를 합쳐 최대 3회 실행합니다. 검색 2회 + 배송비 조회 1회 뒤의 다음 실행은 차단합니다.
        max-total-tool-calls: 3
        on-limit-exceeded: THROW

server:
  address: 127.0.0.1
  port: ${LEARNING_PORT:8102}

spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: shopping-agent-lab
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        max-retries: 0
        timeout: 5s
        options:
          model: ${OPENAI_MODEL}
      embedding:
        max-retries: 0
        timeout: 5s
        options:
          model: ${OPENAI_EMBEDDING_MODEL}

server.servlet.session.cookie.name: LEARNING_CAPSTONE_SESSION
server.servlet.session.cookie.http-only: true
server.servlet.session.cookie.same-site: strict
learning:
  limits:
    max-model-calls: 8
    max-tool-calls: 6
    timeout-ms: 20000

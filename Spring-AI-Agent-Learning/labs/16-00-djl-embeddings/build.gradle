ext.djlVersion = '0.30.0'

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.ai:spring-ai-vector-store'
    implementation "ai.djl:api:${djlVersion}"
    implementation "ai.djl.huggingface:tokenizers:${djlVersion}"
    implementation "ai.djl.pytorch:pytorch-engine:${djlVersion}"
    runtimeOnly 'ai.djl.pytorch:pytorch-native-cpu:2.4.0'
    testImplementation project(':Spring-AI-Agent-Learning:test-support')
}

tasks.named('bootRun') { workingDir rootProject.projectDir }
tasks.named('test') {
    workingDir rootProject.projectDir
    testLogging { showStandardStreams = true }
}

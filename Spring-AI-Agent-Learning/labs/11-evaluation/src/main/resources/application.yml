server:
  address: 127.0.0.1
  port: ${LEARNING_PORT:8101}

spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: evaluation
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        max-retries: 0
        timeout: 2s
        options:
          model: ${OPENAI_MODEL}
      embedding:
        max-retries: 0
        timeout: 2s
        options:
          model: ${OPENAI_EMBEDDING_MODEL}

server:
  address: 127.0.0.1
  port: ${LEARNING_PORT:8101}

spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: evaluation
  ai:
    openai:
      base-url: https://api.openai.com/v1
      api-key: ${OPENAI_API_KEY}
      timeout: 5s
      max-retries: 0
      chat:
        options:
          model: ${OPENAI_MODEL}
      embedding:
        max-retries: 0
        options:
          model: ${OPENAI_EMBEDDING_MODEL}

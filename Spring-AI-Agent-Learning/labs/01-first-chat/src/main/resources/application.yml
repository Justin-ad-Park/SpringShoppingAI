server:
  address: 127.0.0.1
  port: ${LEARNING_PORT:8091}

spring:
  config:
    import: "optional:file:${LEARNING_ENV_FILE:.env}[.properties]"
  application:
    name: first-chat
  ai:
    model:
      embedding: none
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        max-retries: 0
        timeout: 30s
        options:
          model: ${OPENAI_MODEL}

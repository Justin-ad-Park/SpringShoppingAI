// Java·Spring Boot·Spring AI 버전과 공통 의존성은 저장소 루트에서 관리합니다.
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
}

// .env는 저장소 루트에 있다. 실행 디렉터리를 맞춰 Spring Boot가 읽도록 한다.
tasks.named('bootRun') { workingDir rootProject.projectDir }
tasks.withType(Test).configureEach { workingDir rootProject.projectDir }

// 일반 테스트는 로컬 Mock 모델만 사용한다. 실제 OpenAI 호출은 명시적으로 실행한다.
tasks.named('test') {
    useJUnitPlatform { excludeTags 'live-openai' }
    testLogging { showStandardStreams = true }
}
tasks.register('liveOpenAiTest', Test) {
    group = 'verification'
    description = '루트 .env의 설정으로 실제 OpenAI를 한 번 호출하고 응답을 출력합니다.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'live-openai' }
    outputs.upToDateWhen { false }
    testLogging { events 'passed', 'failed', 'skipped'; showStandardStreams = true }
}

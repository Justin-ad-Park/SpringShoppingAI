// Java·Spring Boot·Spring AI 버전과 공통 의존성은 저장소 루트에서 관리합니다.
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
}

// .env는 저장소 루트에 있다. 실행 디렉터리를 맞춰 Spring Boot가 읽도록 한다.
tasks.named('bootRun') { workingDir rootProject.projectDir }
tasks.withType(Test).configureEach { workingDir rootProject.projectDir }

// IntelliJ의 Gradle Run은 test --tests <클래스 또는 메서드>를 사용한다.
// 전체 실행이나 넓은 와일드카드는 실제 호출을 허용하지 않는다.
def explicitlySelectsLiveOpenAiTest = { testTask ->
    def liveClass = 'com.example.ailearning.FirstChatOpenAiLiveTest'
    def simpleClass = 'FirstChatOpenAiLiveTest'
    def patterns = testTask.filter.commandLineIncludePatterns + testTask.filter.includePatterns
    patterns.any { pattern ->
        pattern == liveClass || pattern == simpleClass ||
                pattern.startsWith(liveClass + '.') || pattern.startsWith(simpleClass + '.')
    }
}

// 기본 test는 Mock만 실행하고, 실제 클래스를 명시한 IntelliJ Run만 예외로 허용한다.
tasks.named('test') {
    useJUnitPlatform { excludeTags 'live-openai' }
    outputs.upToDateWhen { !explicitlySelectsLiveOpenAiTest(it) }
    doFirst {
        if (explicitlySelectsLiveOpenAiTest(it)) {
            options.excludeTags = options.excludeTags - 'live-openai'
        }
    }
    testLogging { showStandardStreams = true }
}
tasks.register('liveOpenAiTest', Test) {
    group = 'verification'
    description = '루트 .env의 설정으로 실제 OpenAI를 한 번 호출하고 응답을 출력합니다.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'live-openai' }
    outputs.upToDateWhen { false }
    testLogging { events 'passed', 'failed', 'skipped'; showStandardStreams = true }
}

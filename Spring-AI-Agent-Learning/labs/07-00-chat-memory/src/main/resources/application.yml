server:
  address: 127.0.0.1
  port: ${LEARNING_PORT:8097}

spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: chat-memory
  ai:
    model:
      embedding: none
    openai:
      base-url: https://api.openai.com/v1
      api-key: ${OPENAI_API_KEY}
      chat:
        max-retries: 0
        timeout: 15s
        options:
          model: ${OPENAI_MODEL}

# 브라우저의 다른 실습 서버 쿠키와 구분합니다.
server.servlet.session.cookie.name: LEARNING_MEMORY_SESSION
server.servlet.session.cookie.http-only: true
server.servlet.session.cookie.same-site: strict

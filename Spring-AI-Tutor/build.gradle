dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.ai:spring-ai-openai'
    implementation 'org.springframework.ai:spring-ai-client-chat'
    implementation 'org.springframework.ai:spring-ai-vector-store-advisor'
    implementation 'org.springframework.ai:spring-ai-pdf-document-reader'
    implementation 'org.springframework.ai:spring-ai-jsoup-document-reader'
    implementation 'org.springframework.ai:spring-ai-model-chat-memory-repository-jdbc'
    implementation 'org.springframework.ai:spring-ai-mcp'
    implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'
    implementation 'org.springframework.ai:spring-ai-pgvector-store'
    implementation 'org.springframework:spring-jdbc'
    implementation platform('org.springframework.ai:spring-ai-bom:2.0.1')
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'io.projectreactor:reactor-test'
}

// 웹 학습실에는 허용된 Java 소스만 패키징한다. 임의 로컬 파일 조회 API는 두지 않는다.
tasks.named('processResources') {
    from('src/main/java') { include '**/*.java', '**/README.md'; into 'lesson-sources' }
    from('src/test/java') { include 'com/example/shopping/tutor/lesson/**/*.java'; into 'lesson-test-sources' }
}

tasks.named('test') { useJUnitPlatform { excludeTags 'live', 'mcp', 'live-mcp' } }
['liveEvaluation': 'live', 'mcpIntegrationTest': 'mcp', 'liveMcpTest': 'live-mcp'].each { taskName, tagName ->
    tasks.register(taskName, Test) {
        group = 'verification'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform { includeTags tagName }
        outputs.upToDateWhen { false }
        if (taskName in ['mcpIntegrationTest', 'liveMcpTest']) {
            dependsOn ':shopping-mcp:bootJar'
        }
    }
}

dependencies { testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test' }

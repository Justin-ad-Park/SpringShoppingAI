plugins {
    id 'org.springframework.boot' version '4.0.9' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}
// 자료 폴더와 labs 컨테이너에는 애플리케이션 플러그인을 적용하지 않는다.
configure(subprojects.findAll { it.childProjects.isEmpty() && it.path != ':Spring-AI-Agent-Learning:test-support' }) {
    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'
    group = 'com.example.shopping'
    version = '0.1.0'
    java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
    repositories { mavenCentral() }
    dependencyManagement {
        imports { mavenBom 'org.springframework.ai:spring-ai-bom:2.0.2' }
    }
    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
        implementation 'org.springframework.boot:spring-boot-starter-validation'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    tasks.withType(JavaCompile).configureEach { options.compilerArgs += '-parameters' }
    tasks.named('test') { useJUnitPlatform() }
}
